[config]
schemaVersion = "0.0.1"

[package]
namespace = "Conductor"
name = "SpookyUnits"
versionNumber = "0.1.0"
description = "Port of the SpookyStewards Mod from MT1"
websiteUrl = "https://thunderstore.io"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2100"
MT2-Trainworks_Reloaded = "0.7.28"
